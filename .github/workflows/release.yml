name: Package internal demo release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --frozen
      - run: npm ci
      - run: uv run python -m backend.hr.seed
      - run: bash scripts/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: chengguan-hr-source-release
          path: releases/*.tar.gz
# The artifact is deployed on the designated internal LM Studio host.
# No external host, SSH key, or remote repository was supplied in this task.
# Autonomous deployment to an unspecified environment is intentionally absent.
