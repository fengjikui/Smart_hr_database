name: hr-openfga
services:
  postgres:
    image: postgres:17.11
    env_file: .local/lab.env
    ports: ["127.0.0.1:55433:5432"]
    volumes: ["data:/var/lib/postgresql/data"]
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
    cpus: 0.75
    mem_limit: 512m
  migrate:
    image: openfga/openfga:v1.21.0
    env_file: .local/lab.env
    command: ["migrate"]
    depends_on:
      postgres: {condition: service_healthy}
    cpus: 0.5
    mem_limit: 256m
  openfga:
    image: openfga/openfga:v1.21.0
    env_file: .local/lab.env
    command: ["run"]
    ports: ["127.0.0.1:8089:8080"]
    environment:
      OPENFGA_PLAYGROUND_ENABLED: "false"
      OPENFGA_DATASTORE_MAX_OPEN_CONNS: "10"
      OPENFGA_RESOLVE_NODE_LIMIT: "100"
      OPENFGA_REQUEST_TIMEOUT: "10s"
      OPENFGA_HTTP_UPSTREAM_TIMEOUT: "15s"
      OPENFGA_MAX_CONCURRENT_CHECKS_PER_BATCH_CHECK: "5"
      OPENFGA_MAX_CONCURRENT_READS_FOR_CHECK: "4"
      OPENFGA_LOG_LEVEL: "warn"
      GOMAXPROCS: "2"
    depends_on:
      migrate: {condition: service_completed_successfully}
    cpus: 1
    mem_limit: 512m
volumes:
  data:
